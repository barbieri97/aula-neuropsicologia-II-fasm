# O repositório é gerido com npm (package-lock.json, `npm ci` no CI). Este arquivo existe para
# quem preferir pnpm — e por isso precisa declarar o mesmo workspace do package.json: o tema
# mora em theme/ e é resolvido como pacote a partir dos decks em aulas/.
packages:
  - theme

shamefullyHoist: true

# `playwright-chromium` is needed for `slidev export` (PDF/PNG/PPTX) and has a
# postinstall script that downloads the browser. pnpm v11 errors on unapproved
# build scripts by default (`strictDepBuilds: true`), so allowlist it up-front.
allowBuilds:
  playwright-chromium: true
