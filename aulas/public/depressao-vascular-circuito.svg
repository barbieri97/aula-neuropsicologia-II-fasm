<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-label="Esquema do circuito frontoestriatal-límbico: córtex pré-frontal dorsolateral, cíngulo anterior, núcleo caudado, globo pálido e tálamo formam uma alça fechada; amígdala e hipocampo se conectam ao pré-frontal. Lesões de substância branca marcadas sobre a alça indicam onde a doença de pequenos vasos interrompe o circuito.">
  <rect width="960" height="620" fill="#fdfdfb"/>

  <g font-family="Source Sans 3, Segoe UI, system-ui, sans-serif">

    <!-- Contorno esquemático do encéfalo, corte sagital simplificado -->
    <path d="M120 330 C120 170 300 92 500 92 C700 92 838 176 838 318 C838 430 760 508 640 528 C520 548 300 540 200 470 C146 432 120 386 120 330 Z"
          fill="#fdfdfb" stroke="#b9c6da" stroke-width="2"/>

    <!-- Alça do circuito: PFC -> estriado -> pálido -> tálamo -> PFC -->
    <g fill="none" stroke="#1d3e6e" stroke-width="3.5" stroke-linecap="round">
      <path d="M272 268 C330 226 400 224 452 250"/>
      <path d="M492 286 C520 322 538 356 546 392"/>
      <path d="M540 428 C500 452 452 456 412 442"/>
      <path d="M372 414 C316 388 286 340 276 300"/>
    </g>
    <!-- Setas da alça -->
    <g fill="#1d3e6e">
      <path d="M452 250 l-15 -3 8 12 z"/>
      <path d="M546 392 l-11 -11 -3 15 z"/>
      <path d="M412 442 l13 -8 -12 -10 z"/>
      <path d="M276 300 l4 -15 -14 6 z"/>
    </g>

    <!-- Nós do circuito -->
    <g stroke="#1d3e6e" stroke-width="2.5">
      <ellipse cx="232" cy="264" rx="66" ry="40" fill="#e7ecf3"/>
      <ellipse cx="474" cy="266" rx="52" ry="32" fill="#e7ecf3"/>
      <ellipse cx="562" cy="410" rx="46" ry="29" fill="#e7ecf3"/>
      <ellipse cx="388" cy="430" rx="50" ry="30" fill="#e7ecf3"/>
    </g>

    <g text-anchor="middle" fill="#1b1b19" font-size="14.5" font-weight="600">
      <text x="232" y="258">Pré-frontal</text>
      <text x="232" y="277">dorsolateral</text>
      <text x="474" y="272">Caudado</text>
      <text x="562" y="405">Globo</text>
      <text x="562" y="423">pálido</text>
      <text x="388" y="436">Tálamo</text>
    </g>

    <!-- Estruturas límbicas -->
    <g stroke="#2c6047" stroke-width="2.5">
      <ellipse cx="676" cy="300" rx="52" ry="30" fill="#e5eee9"/>
      <ellipse cx="700" cy="392" rx="58" ry="30" fill="#e5eee9"/>
    </g>
    <g text-anchor="middle" fill="#1b1b19" font-size="14.5" font-weight="600">
      <text x="676" y="306">Amígdala</text>
      <text x="700" y="398">Hipocampo</text>
    </g>
    <g fill="none" stroke="#2c6047" stroke-width="2.5" stroke-dasharray="6 5">
      <path d="M626 292 C560 258 400 236 298 244"/>
      <path d="M644 386 C600 402 570 400 540 396"/>
    </g>

    <!-- Cíngulo anterior -->
    <g stroke="#1d3e6e" stroke-width="2.5">
      <ellipse cx="326" cy="170" rx="70" ry="30" fill="#e7ecf3"/>
    </g>
    <text x="326" y="167" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1b1b19">Cíngulo</text>
    <text x="326" y="185" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1b1b19">anterior</text>
    <path d="M300 202 C284 220 274 238 268 252" fill="none" stroke="#1d3e6e" stroke-width="2.5"/>

    <!-- Lesões de substância branca sobre a alça -->
    <g fill="#8c2f2f" opacity="0.9">
      <ellipse cx="352" cy="238" rx="13" ry="9" transform="rotate(-18 352 238)"/>
      <ellipse cx="516" cy="330" rx="11" ry="8" transform="rotate(38 516 330)"/>
      <ellipse cx="330" cy="384" rx="12" ry="8" transform="rotate(-32 330 384)"/>
      <ellipse cx="404" cy="214" rx="9" ry="7" transform="rotate(-10 404 214)"/>
    </g>

    <!-- Legenda -->
    <line x1="120" y1="556" x2="838" y2="556" stroke="#b9c6da" stroke-width="1"/>
    <g font-size="14" fill="#4a4a45">
      <ellipse cx="132" cy="584" rx="11" ry="8" fill="#8c2f2f"/>
      <text x="152" y="589">hiperintensidades de substância branca — a marca da doença de pequenos vasos</text>
      <rect x="620" y="576" width="18" height="14" fill="#e7ecf3" stroke="#1d3e6e" stroke-width="2"/>
      <text x="646" y="589">alça frontoestriatal</text>
      <rect x="790" y="576" width="18" height="14" fill="#e5eee9" stroke="#2c6047" stroke-width="2"/>
      <text x="816" y="589">límbico</text>
    </g>
  </g>
</svg>
