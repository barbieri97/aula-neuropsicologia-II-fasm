<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="A alça frontoestriatal desenhada como um circuito fechado: pré-frontal dorsolateral, caudado, globo pálido e tálamo em sequência, com o retorno ao pré-frontal fechando a alça. Marcas vermelhas sobre as conexões indicam as hiperintensidades de substância branca que interrompem o circuito — a lesão está na fiação entre as estruturas, não dentro delas.">
  <rect width="1000" height="340" fill="#fdfdfb"/>

  <g font-family="'Source Sans 3','Segoe UI',system-ui,sans-serif">

    <text x="30" y="28" font-size="16" font-weight="700" fill="#1d3e6e" letter-spacing="1.6">ALÇA FRONTOESTRIATAL</text>

    <!-- Conexões: é sobre elas que a doença de pequenos vasos age -->
    <g stroke="#1d3e6e" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M212 100 H265"/><path d="M465 100 H518"/><path d="M718 100 H771"/>
    </g>
    <g fill="#1d3e6e">
      <path d="M265 92 l14 8 -14 8 z"/><path d="M518 92 l14 8 -14 8 z"/><path d="M771 92 l14 8 -14 8 z"/>
    </g>

    <!-- Retorno ao pré-frontal: é o que faz da via uma alça -->
    <path d="M879 144 V206 Q879 222 863 222 H136 Q120 222 120 206 V156"
          fill="none" stroke="#1d3e6e" stroke-width="3" stroke-linecap="round"/>
    <path d="M112 162 l8 -14 8 14 z" fill="#1d3e6e"/>

    <!-- Estruturas -->
    <g fill="#e7ecf3" stroke="#1d3e6e" stroke-width="2.5">
      <rect x="30" y="56" width="180" height="88" rx="4"/>
      <rect x="283" y="56" width="180" height="88" rx="4"/>
      <rect x="536" y="56" width="180" height="88" rx="4"/>
      <rect x="789" y="56" width="180" height="88" rx="4"/>
    </g>
    <g text-anchor="middle" fill="#1b1b19" font-size="20" font-weight="600">
      <text x="120" y="94">Pré-frontal</text>
      <text x="120" y="116">dorsolateral</text>
      <text x="373" y="107">Caudado</text>
      <text x="626" y="94">Globo</text>
      <text x="626" y="116">pálido</text>
      <text x="879" y="107">Tálamo</text>
    </g>

    <!-- Hiperintensidades de substância branca, sobre as conexões -->
    <g fill="#8c2f2f">
      <ellipse cx="234" cy="100" rx="12" ry="8" transform="rotate(-18 234 100)"/>
      <ellipse cx="487" cy="100" rx="11" ry="8" transform="rotate(24 487 100)"/>
      <ellipse cx="740" cy="100" rx="12" ry="8" transform="rotate(-12 740 100)"/>
      <ellipse cx="400" cy="222" rx="11" ry="8" transform="rotate(16 400 222)"/>
    </g>

    <!-- Legenda -->
    <line x1="30" y1="272" x2="970" y2="272" stroke="#b9c6da" stroke-width="1"/>
    <ellipse cx="42" cy="296" rx="12" ry="8" fill="#8c2f2f"/>
    <text x="66" y="302" font-size="17" fill="#4a4a45">hiperintensidades de substância branca — mais frequentes em idosos deprimidos (Alexopoulos et al., 1997)</text>

  </g>
</svg>
