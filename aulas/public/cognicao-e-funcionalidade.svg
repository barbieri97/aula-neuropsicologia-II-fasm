<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-label="Duas metades da avaliação: à esquerda a medida da cognição por domínio, à direita a checagem das atividades instrumentais com informante; as duas convergem para o diagnóstico">
  <rect width="1000" height="360" fill="#fdfdfb"/>

  <g font-family="'Source Sans 3','Segoe UI',system-ui,sans-serif">

    <text x="24" y="26" font-size="17" font-weight="700" fill="#8a5a12" letter-spacing="1.5">CRITÉRIO A</text>
    <text x="976" y="26" font-size="17" font-weight="700" fill="#8a5a12" letter-spacing="1.5" text-anchor="end">CRITÉRIO B</text>

    <!-- metade da cognição -->
    <rect x="24" y="40" width="454" height="222" fill="#e7ecf3" stroke="#b9c6da" stroke-width="1.5"/>
    <text x="48" y="80" font-size="25" font-weight="700" fill="#1d3e6e">Cognição</text>
    <text x="48" y="106" font-size="18" fill="#4a4a45">testagem padronizada</text>

    <g font-size="18" fill="#1b1b19">
      <g fill="#1d3e6e"><rect x="48" y="136" width="11" height="11"/><rect x="48" y="172" width="11" height="11"/><rect x="48" y="208" width="11" height="11"/><rect x="268" y="136" width="11" height="11"/><rect x="268" y="172" width="11" height="11"/><rect x="268" y="208" width="11" height="11"/></g>
      <text x="70" y="146">atenção complexa</text>
      <text x="70" y="182">função executiva</text>
      <text x="70" y="218">memória</text>
      <text x="290" y="146">linguagem</text>
      <text x="290" y="182">perceptomotor</text>
      <text x="290" y="218">cognição social</text>
    </g>

    <text x="48" y="248" font-size="17" fill="#4a4a45">norma por idade e escolaridade</text>

    <!-- metade da funcionalidade -->
    <rect x="522" y="40" width="454" height="222" fill="#f4ece0" stroke="#d9bd93" stroke-width="1.5"/>
    <text x="546" y="80" font-size="25" font-weight="700" fill="#8a5a12">Funcionalidade</text>
    <text x="546" y="106" font-size="18" fill="#4a4a45">entrevista com informante</text>

    <g font-size="18" fill="#1b1b19">
      <g fill="none" stroke="#8a5a12" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M546 141 l4 5 8 -10"/><path d="M546 177 l4 5 8 -10"/><path d="M546 213 l4 5 8 -10"/>
        <path d="M766 141 l4 5 8 -10"/><path d="M766 177 l4 5 8 -10"/><path d="M766 213 l4 5 8 -10"/>
      </g>
      <text x="570" y="146">dinheiro</text>
      <text x="570" y="182">medicação</text>
      <text x="570" y="218">transporte</text>
      <text x="790" y="146">telefone</text>
      <text x="790" y="182">compras</text>
      <text x="790" y="218">refeição</text>
    </g>

    <text x="546" y="248" font-size="17" fill="#4a4a45">comparadas ao que a pessoa fazia antes</text>

    <!-- as duas convergem para o mesmo pé -->
    <g fill="none" stroke="#6b6b63" stroke-width="2.5" stroke-linecap="round">
      <path d="M251 262 V286 H500"/>
      <path d="M749 262 V286 H500"/>
      <path d="M500 286 V300"/>
      <path d="M492 292 l8 9 8 -9"/>
    </g>

    <rect x="326" y="306" width="348" height="44" fill="#1d3e6e"/>
    <text x="500" y="335" font-size="22" font-weight="600" fill="#fdfdfb" text-anchor="middle">TNC leve ou TNC maior</text>

  </g>
</svg>
