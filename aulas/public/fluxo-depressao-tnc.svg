<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="Diante de queixa cognitiva no idoso o fluxo abre em três desfechos, não dois: quadro depressivo provável, que se trata e reavalia; os dois quadros ao mesmo tempo, o cenário mais comum na clínica geriátrica, que se reavalia em 6 a 12 semanas; e transtorno neurocognitivo provável, que segue para investigação etiológica.">
  <rect width="1000" height="330" fill="#fdfdfb"/>

  <g font-family="'Source Sans 3','Segoe UI',system-ui,sans-serif">

    <!-- Entrada -->
    <rect x="350" y="10" width="300" height="42" rx="4" fill="#1d3e6e"/>
    <text x="500" y="38" text-anchor="middle" font-size="19" font-weight="600" fill="#fdfdfb">Queixa cognitiva no idoso</text>

    <!-- Abertura em três -->
    <g stroke="#1d3e6e" stroke-width="3" fill="none" stroke-linecap="square">
      <path d="M500 52 V74"/>
      <path d="M175 74 H825"/>
      <path d="M175 74 V100"/><path d="M500 74 V100"/><path d="M825 74 V100"/>
    </g>

    <!-- Desfecho 1 -->
    <rect x="25" y="100" width="300" height="202" rx="4" fill="#e7ecf3" stroke="#1d3e6e" stroke-width="2.5"/>
    <g text-anchor="middle">
      <text x="175" y="136" font-size="18.5" font-weight="700" fill="#1d3e6e">Quadro depressivo</text>
      <text x="175" y="158" font-size="18.5" font-weight="700" fill="#1d3e6e">provável</text>
      <line x1="45" y1="176" x2="305" y2="176" stroke="#b9c6da" stroke-width="1"/>
      <text x="175" y="206" font-size="16.5" fill="#1b1b19">o humor mudou primeiro</text>
      <text x="175" y="230" font-size="16.5" fill="#1b1b19">melhora com pista</text>
      <text x="175" y="272" font-size="17.5" font-weight="700" fill="#1d3e6e">Tratar e reavaliar</text>
    </g>

    <!-- Desfecho 2: o do meio, o mais frequente -->
    <rect x="350" y="100" width="300" height="202" rx="4" fill="#f4ece0" stroke="#8a5a12" stroke-width="2.5"/>
    <g text-anchor="middle">
      <text x="500" y="136" font-size="18.5" font-weight="700" fill="#8a5a12">Os dois quadros</text>
      <text x="500" y="158" font-size="18.5" font-weight="700" fill="#8a5a12">ao mesmo tempo</text>
      <line x1="370" y1="176" x2="630" y2="176" stroke="#d8c3a0" stroke-width="1"/>
      <text x="500" y="206" font-size="16.5" fill="#1b1b19">o cenário mais comum</text>
      <text x="500" y="230" font-size="16.5" fill="#1b1b19">na clínica geriátrica</text>
      <text x="500" y="272" font-size="17.5" font-weight="700" fill="#8a5a12">Reavaliar em 6–12 semanas</text>
    </g>

    <!-- Desfecho 3 -->
    <rect x="675" y="100" width="300" height="202" rx="4" fill="#f5e7e7" stroke="#8c2f2f" stroke-width="2.5"/>
    <g text-anchor="middle">
      <text x="825" y="136" font-size="18.5" font-weight="700" fill="#8c2f2f">Transtorno neurocognitivo</text>
      <text x="825" y="158" font-size="18.5" font-weight="700" fill="#8c2f2f">provável</text>
      <line x1="695" y1="176" x2="955" y2="176" stroke="#e0bdbd" stroke-width="1"/>
      <text x="825" y="206" font-size="16.5" fill="#1b1b19">o desempenho mudou primeiro</text>
      <text x="825" y="230" font-size="16.5" fill="#1b1b19">pista não melhora, confabula</text>
      <text x="825" y="272" font-size="17.5" font-weight="700" fill="#8c2f2f">Investigação etiológica</text>
    </g>

  </g>
</svg>
