<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 500" width="1400" height="500" role="img" aria-label="A Figura Complexa de Taylor simplificada com os doze elementos numerados, como na folha de registro: 1 retângulo principal; 2 triângulo à esquerda; 3 seta vertical na ponta desse triângulo; 4 linha vertical central; 5 linha horizontal central; 6 triângulo inferior, no canto de baixo à direita; 7 linha pontilhada, do centro ao canto de baixo à direita; 8 estrela, no quadrante inferior esquerdo; 9 X no quadrante superior esquerdo; 10 diagonal no quadrante superior direito; 11 retângulo superior, sobre a metade esquerda; 12 seta que sai do canto superior direito">
