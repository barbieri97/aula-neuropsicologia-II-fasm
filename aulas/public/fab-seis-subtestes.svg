<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-label="Os seis subtestes da Bateria de Avaliação Frontal em dois blocos de três, cada um com o domínio executivo que investiga: semelhanças e conceituação, fluência lexical e flexibilidade mental, série motora e programação, instruções conflitantes e sensibilidade à interferência, vai-não vai e controle inibitório, comportamento de preensão e autonomia ambiental">
  <style>
    .num { font-family: 'Source Sans 3','Segoe UI',system-ui,sans-serif; font-size: 17px; fill: #fdfdfb; font-weight: 700; }
    .sub { font-family: 'Source Sans 3','Segoe UI',system-ui,sans-serif; font-size: 19px; fill: #1d3e6e; }
    .dom { font-family: 'Source Sans 3','Segoe UI',system-ui,sans-serif; font-size: 17px; fill: #4a4a45; }
    .ori { font-family: 'Source Sans 3','Segoe UI',system-ui,sans-serif; font-size: 15px; fill: #6b6b63; letter-spacing: 0.1em; }
  </style>

  <!-- linha de cima -->
  <rect x="20" y="20" width="306" height="128" fill="#e7ecf3" stroke="#b9c6da" stroke-width="1.5"/>
  <circle cx="56" cy="56" r="17" fill="#1d3e6e"/>
  <text class="num" x="56" y="62" text-anchor="middle">1</text>
  <text class="sub" x="86" y="62">Semelhanças</text>
  <text class="dom" x="46" y="106">conceituação</text>

  <rect x="347" y="20" width="306" height="128" fill="#e7ecf3" stroke="#b9c6da" stroke-width="1.5"/>
  <circle cx="383" cy="56" r="17" fill="#1d3e6e"/>
  <text class="num" x="383" y="62" text-anchor="middle">2</text>
  <text class="sub" x="413" y="62">Fluência lexical</text>
  <text class="dom" x="373" y="106">flexibilidade mental</text>

  <rect x="674" y="20" width="306" height="128" fill="#e7ecf3" stroke="#b9c6da" stroke-width="1.5"/>
  <circle cx="710" cy="56" r="17" fill="#1d3e6e"/>
  <text class="num" x="710" y="62" text-anchor="middle">3</text>
  <text class="sub" x="740" y="62">Série motora</text>
  <text class="dom" x="700" y="106">programação</text>

  <!-- linha de baixo -->
  <rect x="20" y="168" width="306" height="128" fill="#e7ecf3" stroke="#b9c6da" stroke-width="1.5"/>
  <circle cx="56" cy="204" r="17" fill="#1d3e6e"/>
  <text class="num" x="56" y="210" text-anchor="middle">4</text>
  <text class="sub" x="86" y="210">Instruções conflitantes</text>
  <text class="dom" x="46" y="254">sensibilidade à interferência</text>

  <rect x="347" y="168" width="306" height="128" fill="#e7ecf3" stroke="#b9c6da" stroke-width="1.5"/>
  <circle cx="383" cy="204" r="17" fill="#8a5a12"/>
  <text class="num" x="383" y="210" text-anchor="middle">5</text>
  <text class="sub" x="413" y="210">Vai–não vai</text>
  <text class="dom" x="373" y="254">controle inibitório</text>

  <rect x="674" y="168" width="306" height="128" fill="#e7ecf3" stroke="#b9c6da" stroke-width="1.5"/>
  <circle cx="710" cy="204" r="17" fill="#8a5a12"/>
  <text class="num" x="710" y="210" text-anchor="middle">6</text>
  <text class="sub" x="740" y="210">Preensão</text>
  <text class="dom" x="700" y="254">autonomia ambiental</text>

  <text class="ori" x="20"  y="336">CADA UM VALE DE 0 A 3</text>
  <text class="ori" x="980" y="336" text-anchor="end">TOTAL DE 0 A 18</text>
  <line x1="250" y1="331" x2="800" y2="331" stroke="#dcdbd3" stroke-width="1.5"/>
</svg>
