<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Funil com quatro filtros entre o quadro psiquiátrico presente no idoso e o diagnóstico que chega a ser registrado: apresentação atípica, comorbidade clínica, iatrogenia e subdiagnóstico">
  <rect width="960" height="560" fill="#fdfdfb"/>

  <g font-family="Source Sans 3, Segoe UI, system-ui, sans-serif">

    <!-- Rótulo de entrada -->
    <text x="48" y="52" font-size="19" font-weight="600" fill="#1b1b19">O quadro que o idoso de fato tem</text>
    <text x="48" y="76" font-size="15" fill="#6b6b63">sintomas presentes, sofrimento presente</text>

    <!-- Funil -->
    <path d="M48 104 H912 L744 388 H216 Z" fill="#e7ecf3" stroke="#b9c6da" stroke-width="1.5"/>

    <!-- Quatro filtros: linhas verticais que atravessam o funil -->
    <g stroke="#1d3e6e" stroke-width="2.5" stroke-dasharray="7 5">
      <path d="M221 104 V388"/>
      <path d="M394 104 V388"/>
      <path d="M567 104 V388"/>
      <path d="M740 104 V388"/>
    </g>

    <!-- Numerais dos filtros -->
    <g fill="#1d3e6e" font-size="15" font-weight="700" text-anchor="middle">
      <circle cx="221" cy="104" r="15" fill="#1d3e6e"/><text x="221" y="110" fill="#fdfdfb">1</text>
      <circle cx="394" cy="104" r="15" fill="#1d3e6e"/><text x="394" y="110" fill="#fdfdfb">2</text>
      <circle cx="567" cy="104" r="15" fill="#1d3e6e"/><text x="567" y="110" fill="#fdfdfb">3</text>
      <circle cx="740" cy="104" r="15" fill="#1d3e6e"/><text x="740" y="110" fill="#fdfdfb">4</text>
    </g>

    <!-- Legendas dentro do funil -->
    <g text-anchor="middle" fill="#1b1b19">
      <text x="135" y="180" font-size="17" font-weight="600">Apresentação</text>
      <text x="135" y="203" font-size="17" font-weight="600">atípica</text>
      <text x="135" y="232" font-size="13.5" fill="#4a4a45">queixa somática</text>
      <text x="135" y="251" font-size="13.5" fill="#4a4a45">no lugar de tristeza</text>

      <text x="308" y="180" font-size="17" font-weight="600">Comorbidade</text>
      <text x="308" y="203" font-size="17" font-weight="600">clínica</text>
      <text x="308" y="232" font-size="13.5" fill="#4a4a45">o sintoma é creditado</text>
      <text x="308" y="251" font-size="13.5" fill="#4a4a45">à doença de base</text>

      <text x="481" y="180" font-size="17" font-weight="600">Iatrogenia</text>
      <text x="481" y="209" font-size="13.5" fill="#4a4a45">fármacos produzem</text>
      <text x="481" y="228" font-size="13.5" fill="#4a4a45">o quadro — e mascaram</text>
      <text x="481" y="247" font-size="13.5" fill="#4a4a45">o desempenho no teste</text>

      <text x="654" y="180" font-size="17" font-weight="600">Subdiagnóstico</text>
      <text x="654" y="209" font-size="13.5" fill="#4a4a45">&#8220;é da idade&#8221; —</text>
      <text x="654" y="228" font-size="13.5" fill="#4a4a45">nem o paciente nem</text>
      <text x="654" y="247" font-size="13.5" fill="#4a4a45">o clínico nomeiam</text>
    </g>

    <!-- Seta de fluxo -->
    <g stroke="#1d3e6e" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M48 330 H880"/>
      <path d="M866 318 l16 12 -16 12"/>
    </g>

    <!-- Saída -->
    <text x="480" y="440" font-size="19" font-weight="600" fill="#8c2f2f" text-anchor="middle">O que chega a ser diagnosticado e tratado</text>
    <text x="480" y="466" font-size="15" fill="#6b6b63" text-anchor="middle">uma fração do que existe — e é sobre essa fração que a literatura de prevalência se constrói</text>

    <!-- Nota -->
    <line x1="48" y1="500" x2="912" y2="500" stroke="#b9c6da" stroke-width="1"/>
    <text x="48" y="527" font-size="13.5" fill="#6b6b63">Cada filtro age antes do encaminhamento para a avaliação neuropsicológica — e é por isso que o motivo do encaminhamento raramente é o diagnóstico.</text>
  </g>
</svg>
