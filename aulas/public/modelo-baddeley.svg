<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-label="A central executiva no topo, controlando três subsistemas — alça fonológica, buffer episódico e esboço visuoespacial — e, abaixo de cada um, o sistema de longo prazo com que ele conversa">
  <style>
    .exe { font-family: 'Source Sans 3','Segoe UI',system-ui,sans-serif; font-size: 21px; fill: #fdfdfb; }
    .exs { font-family: 'Source Sans 3','Segoe UI',system-ui,sans-serif; font-size: 16px; fill: #b9c6da; }
    .sub { font-family: 'Source Sans 3','Segoe UI',system-ui,sans-serif; font-size: 19px; fill: #1d3e6e; }
    .des { font-family: 'Source Sans 3','Segoe UI',system-ui,sans-serif; font-size: 16px; fill: #4a4a45; }
    .mlp { font-family: 'Source Sans 3','Segoe UI',system-ui,sans-serif; font-size: 16px; fill: #6b6b63; }
    .fai { font-family: 'Source Sans 3','Segoe UI',system-ui,sans-serif; font-size: 15px; fill: #6b6b63; letter-spacing: 0.1em; }
  </style>

  <!-- central executiva -->
  <rect x="290" y="14" width="420" height="72" fill="#1d3e6e"/>
  <text class="exe" x="500" y="46" text-anchor="middle">Central executiva</text>
  <text class="exs" x="500" y="72" text-anchor="middle">controla a atenção · capacidade limitada</text>

  <!-- fios da executiva para os três subsistemas -->
  <path d="M 500 86 L 500 108" stroke="#1d3e6e" stroke-width="2"/>
  <path d="M 152 108 L 848 108" stroke="#1d3e6e" stroke-width="2"/>
  <path d="M 152 108 L 152 140" stroke="#1d3e6e" stroke-width="2"/>
  <path d="M 500 108 L 500 140" stroke="#1d3e6e" stroke-width="2"/>
  <path d="M 848 108 L 848 140" stroke="#1d3e6e" stroke-width="2"/>

  <!-- os três subsistemas -->
  <rect x="16" y="140" width="272" height="86" fill="#e7ecf3" stroke="#1d3e6e" stroke-width="1.5"/>
  <text class="sub" x="152" y="176" text-anchor="middle">Alça fonológica</text>
  <text class="des" x="152" y="204" text-anchor="middle">som e fala, reciclados</text>

  <rect x="364" y="140" width="272" height="86" fill="#e7ecf3" stroke="#1d3e6e" stroke-width="1.5"/>
  <text class="sub" x="500" y="176" text-anchor="middle">Buffer episódico</text>
  <text class="des" x="500" y="204" text-anchor="middle">junta os códigos num episódio</text>

  <rect x="712" y="140" width="272" height="86" fill="#e7ecf3" stroke="#1d3e6e" stroke-width="1.5"/>
  <text class="sub" x="848" y="176" text-anchor="middle">Esboço visuoespacial</text>
  <text class="des" x="848" y="204" text-anchor="middle">imagem e posição no espaço</text>

  <!-- fios para o longo prazo -->
  <g stroke="#bfbeb3" stroke-width="1.5" stroke-dasharray="5 4">
    <path d="M 152 226 L 152 262"/>
    <path d="M 500 226 L 500 262"/>
    <path d="M 848 226 L 848 262"/>
  </g>

  <rect x="16" y="262" width="272" height="58" fill="#f5f4ee" stroke="#dcdbd3"/>
  <text class="mlp" x="152" y="298" text-anchor="middle">Linguagem</text>

  <rect x="364" y="262" width="272" height="58" fill="#f5f4ee" stroke="#dcdbd3"/>
  <text class="mlp" x="500" y="298" text-anchor="middle">Memória episódica de longo prazo</text>

  <rect x="712" y="262" width="272" height="58" fill="#f5f4ee" stroke="#dcdbd3"/>
  <text class="mlp" x="848" y="298" text-anchor="middle">Semântica visual</text>

  <text class="fai" x="16" y="344">SISTEMAS CRISTALIZADOS, DE LONGO PRAZO</text>
</svg>
