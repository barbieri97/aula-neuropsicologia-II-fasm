<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 348" width="1000" height="348" role="img" aria-label="Linha do tempo da idade de início: esquizofrenia de início precoce antes dos 40, tardio entre 40 e 60 e psicose esquizofreniforme de início muito tardio depois dos 60; transtorno bipolar precoce antes dos 40 e tardio depois, com corte ainda sem consenso entre 40 e 50; depressão precoce até os 60 e tardia depois; transtorno neurocognitivo com incidência crescendo a partir dos 65. Depois dos 60 os quatro quadros se sobrepõem.">
  <rect width="1000" height="348" fill="#fdfdfb"/>

  <g font-family="'Source Sans 3','Segoe UI',system-ui,sans-serif">

    <!-- Faixa dos 60 em diante: onde os quatro convivem -->
    <rect x="631" y="52" width="339" height="240" fill="#8c2f2f" opacity="0.05"/>
    <text x="800" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#8c2f2f">a faixa em que os quatro se sobrepõem</text>

    <!-- Cortes de consenso -->
    <g stroke="#8fa4c2" stroke-width="1.5" stroke-dasharray="6 5">
      <path d="M406 52 V292"/>
      <path d="M631 52 V292"/>
    </g>
    <g font-size="16" font-weight="700" fill="#1d3e6e" text-anchor="middle">
      <text x="406" y="44">40 anos</text>
      <text x="631" y="44">60 anos</text>
    </g>

    <!-- Esquizofrenia -->
    <text x="170" y="85" text-anchor="end" font-size="17" font-weight="700" fill="#1b1b19">Esquizofrenia</text>
    <rect x="180" y="56" width="226" height="46" rx="3" fill="#e7ecf3" stroke="#1d3e6e" stroke-width="2"/>
    <text x="293" y="85" text-anchor="middle" font-size="16.5" fill="#1b1b19">início precoce</text>
    <rect x="406" y="56" width="225" height="46" rx="3" fill="#cdd9ea" stroke="#1d3e6e" stroke-width="2"/>
    <text x="518" y="85" text-anchor="middle" font-size="16.5" fill="#1b1b19">início tardio</text>
    <rect x="631" y="56" width="339" height="46" rx="3" fill="#1d3e6e"/>
    <text x="800" y="85" text-anchor="middle" font-size="16.5" font-weight="600" fill="#fdfdfb">psicose de início muito tardio</text>

    <!-- Transtorno bipolar -->
    <text x="170" y="130" text-anchor="end" font-size="17" font-weight="700" fill="#1b1b19">Transtorno</text>
    <text x="170" y="152" text-anchor="end" font-size="17" font-weight="700" fill="#1b1b19">bipolar</text>
    <rect x="180" y="114" width="226" height="46" rx="3" fill="#e5eee9" stroke="#2c6047" stroke-width="2"/>
    <text x="293" y="143" text-anchor="middle" font-size="16.5" fill="#1b1b19">início precoce</text>
    <rect x="406" y="114" width="564" height="46" rx="3" fill="#2c6047"/>
    <text x="688" y="143" text-anchor="middle" font-size="16.5" font-weight="600" fill="#fdfdfb">início tardio — corte entre 40 e 50, ainda sem consenso</text>

    <!-- Depressão -->
    <text x="170" y="201" text-anchor="end" font-size="17" font-weight="700" fill="#1b1b19">Depressão</text>
    <rect x="180" y="172" width="451" height="46" rx="3" fill="#f4ece0" stroke="#8a5a12" stroke-width="2"/>
    <text x="405" y="201" text-anchor="middle" font-size="16.5" fill="#1b1b19">início precoce — mais comorbidade psiquiátrica</text>
    <rect x="631" y="172" width="339" height="46" rx="3" fill="#8a5a12"/>
    <text x="800" y="201" text-anchor="middle" font-size="16.5" font-weight="600" fill="#fdfdfb">início tardio — mais lesão vascular</text>

    <!-- Transtorno neurocognitivo -->
    <text x="170" y="246" text-anchor="end" font-size="17" font-weight="700" fill="#1b1b19">Transtorno</text>
    <text x="170" y="268" text-anchor="end" font-size="17" font-weight="700" fill="#1b1b19">neurocognitivo</text>
    <path d="M519 276 C580 276 615 246 665 240 C740 232 860 232 970 232 L970 276 Z"
          fill="#f5e7e7" stroke="#8c2f2f" stroke-width="2"/>
    <text x="800" y="264" text-anchor="middle" font-size="16.5" fill="#1b1b19">incidência cresce a partir dos 65</text>

    <!-- Eixo -->
    <line x1="180" y1="292" x2="970" y2="292" stroke="#1b1b19" stroke-width="2.5"/>
    <g stroke="#1b1b19" stroke-width="2">
      <path d="M180 292 V302"/><path d="M293 292 V302"/><path d="M406 292 V302"/><path d="M518 292 V302"/>
      <path d="M631 292 V302"/><path d="M744 292 V302"/><path d="M857 292 V302"/><path d="M970 292 V302"/>
    </g>
    <g font-size="15.5" fill="#4a4a45" text-anchor="middle">
      <text x="180" y="320">20</text><text x="293" y="320">30</text><text x="406" y="320">40</text><text x="518" y="320">50</text>
      <text x="631" y="320">60</text><text x="744" y="320">70</text><text x="857" y="320">80</text><text x="970" y="320">90</text>
    </g>
    <text x="575" y="342" text-anchor="middle" font-size="15.5" fill="#6b6b63">idade de início (anos) — cortes de Howard, Rabins, Seeman e Jeste (2000)</text>

  </g>
</svg>
